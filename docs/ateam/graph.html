<script>
"use strict";
const G = JSON.parse(document.getElementById("graph").textContent);
const COLORS = { G: "#3a8d3f", NG: "#9c7a3c", P: "#2a8a8a", R: "#00897b", PER: "#e09a00", US: "#3b6fd4", FR: "#3b6fd4", NFR: "#6a5acd",

  CR: "#ef6c00", ADR: "#546e7a", S: "#6d4c41", T: "#9e9d24", DEC: "#9e9e9e", F: "#c62828" };
const CLOSED = { F: ["fixed", "accepted"], CR: ["implemented", "rejected"], S: ["closed"], UX: ["rejected"] };
const ALWAYS_LABELLED = new Set(["G", "M", "C", "svc"]);
const WEAK = "mentions";
const color = k => COLORS[k] || `hsl(${[...k].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7)} 45% 50%)`;
const past = n => n.kind === "DEC" || (CLOSED[n.kind] || []).includes(n.status || "") || (n.status || "").startsWith("superseded");

const nodes = G.nodes, byId = new Map(nodes.map(n => [n.id, n]));
nodes.forEach(n => { n.out = []; n.in = []; n.past = past(n); });
const edges = G.edges.filter(e => byId.has(e[0]) && byId.has(e[2]))
  .map(e => ({ s: byId.get(e[0]), rel: e[1], t: byId.get(e[2]), note: e[3] || "", weak: e[1] === WEAK }));
edges.forEach(e => { e.s.out.push(e); e.t.in.push(e); });
nodes.forEach(n => { n.deg = n.out.length + n.in.length; n.r = Math.min(14, 3.5 + 1.4 * Math.sqrt(n.deg)); });
document.getElementById("name").textContent = G.project ? `${G.project}: project graph` : "Project graph";
document.title = G.project ? `${G.project} graph` : "Project graph";

// deterministic start: each kind on its own ring sector, so reloads settle into the same picture
const kindsPresent = Object.keys(G.counts);
function seeded(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
nodes.forEach(n => {
  const rnd = seeded(n.id), k = kindsPresent.indexOf(n.kind), a = (k + rnd()) / kindsPresent.length * 2 * Math.PI;
  const rad = 120 + 260 * rnd();
  n.x = Math.cos(a) * rad; n.y = Math.sin(a) * rad; n.vx = 0; n.vy = 0;
});

const shownKinds = new Set(kindsPresent.filter(k => !["DEC", "T"].includes(k)));
let showHistory = false, hops = 1, selected = null, hover = null, visible = [], visEdges = [];

function neighbourhood(start, depth) {
  const seen = new Set([start]); let frontier = [start];
  for (let d = 0; d < depth; d++) {
    const next = [];
    for (const n of frontier) for (const e of n.out.concat(n.in)) {
      const m = e.s === n ? e.t : e.s;
      if (!seen.has(m) && ok(m)) { seen.add(m); next.push(m); }
    }
    frontier = next;
  }
  return seen;
}
const ok = n => shownKinds.has(n.kind) && (showHistory || !n.past);
function refilter() {
  let set = new Set(nodes.filter(ok));
  if (selected && hops > 0) set = neighbourhood(selected, hops);
  if (selected) set.add(selected);
  visible = nodes.filter(n => set.has(n));
  visEdges = edges.filter(e => set.has(e.s) && set.has(e.t));
  alpha = 1; fitted = false;
}
// while the layout settles, keep what is visible in frame, until the reader pans or zooms
let fitted = false;
function fit() {
  if (!visible.length) return;
  const xs = visible.map(n => n.x), ys = visible.map(n => n.y), pad = 40;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  scale = Math.max(0.15, Math.min(2.5, Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1))));
  ox = -(x0 + x1) / 2 * scale; oy = -(y0 + y1) / 2 * scale;
}

// layout: springs along links, repulsion between nodes, a pull to the centre; cooled over a few hundred ticks
let alpha = 1;
function tick() {
  const n = visible.length, k = 70;

      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const f = k * k / d2 * alpha * 0.6, d = Math.sqrt(d2);
      a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
    }
  }
  for (const e of visEdges) {
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - (e.weak ? 110 : 55)) / d * (e.weak ? 0.02 : 0.06) * alpha;
    e.s.vx += dx * f; e.s.vy += dy * f; e.t.vx -= dx * f; e.t.vy -= dy * f;
  }
  for (const a of visible) {
    if (a === dragging) continue;
    a.vx -= a.x * 0.004 * alpha; a.vy -= a.y * 0.004 * alpha;
    a.x += Math.max(-30, Math.min(30, a.vx)); a.y += Math.max(-30, Math.min(30, a.vy));
    a.vx *= 0.55; a.vy *= 0.55;
  }
  alpha *= 0.985;
}

// drawing
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), tip = document.getElementById("tip");
let scale = 1, ox = 0, oy = 0, W = 0, H = 0;
function resize() {
  const r = canvas.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2 + ox, H / 2 + oy); ctx.scale(scale, scale);
  const edge = css("--edge"), fg = css("--fg"), lit = selected ? new Set([selected, ...selected.out.map(e => e.t), ...selected.in.map(e => e.s)]) : null;
  for (const e of visEdges) {
    const on = selected && (e.s === selected || e.t === selected);
    ctx.strokeStyle = `rgba(${edge}, ${on ? 0.85 : selected ? 0.08 : e.weak ? 0.12 : 0.28})`;
    ctx.lineWidth = (on ? 1.6 : 0.8) / scale; ctx.setLineDash(e.weak ? [4 / scale, 4 / scale] : []);
    ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke();
    if (on && !e.weak) arrow(e);
  }
  ctx.setLineDash([]);
  for (const n of visible) {
    ctx.globalAlpha = lit && !lit.has(n) ? 0.25 : n.past ? 0.55 : 1;
    ctx.fillStyle = color(n.kind); ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI); ctx.fill();
    if (n === selected || n === hover) { ctx.lineWidth = 2.5 / scale; ctx.strokeStyle = fg; ctx.stroke(); }
  }
  ctx.globalAlpha = 1; ctx.fillStyle = fg; ctx.font = `${11 / scale}px system-ui, sans-serif`;
  for (const n of visible) {
    if (n === selected || n === hover || (lit && lit.has(n)) || (!lit && (ALWAYS_LABELLED.has(n.kind) || scale > 1.8)))
      ctx.fillText(n.id, n.x + n.r + 2 / scale, n.y + 3.5 / scale);
  }
  ctx.restore();
}
function arrow(e) {
  const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1, ux = dx / d, uy = dy / d;
  const x = e.t.x - ux * (e.t.r + 2), y = e.t.y - uy * (e.t.r + 2), s = 7 / scale;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - ux * s - uy * s * .5, y - uy * s + ux * s * .5);
  ctx.lineTo(x - ux * s + uy * s * .5, y - uy * s - ux * s * .5); ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
}
function frame() {
  if (alpha > 0.02) { tick(); tick(); if (!fitted) fit(); } else fitted = true;
  draw(); requestAnimationFrame(frame);
}

// interaction
const world = (cx, cy) => [(cx - W / 2 - ox) / scale, (cy - H / 2 - oy) / scale];
function at(cx, cy) {
  const [x, y] = world(cx, cy); let best = null, bd = Infinity;
  for (const n of visible) { const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd && d < (n.r + 4 / scale) ** 2) { best = n; bd = d; } }
  return best;
}
let dragging = null, panning = null, moved = false;
canvas.addEventListener("mousedown", ev => {
  moved = false; fitted = true; dragging = at(ev.offsetX, ev.offsetY);
  if (!dragging) panning = [ev.clientX - ox, ev.clientY - oy];
});
window.addEventListener("mousemove", ev => {
  const r = canvas.getBoundingClientRect(), cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  if (dragging) { [dragging.x, dragging.y] = world(cx, cy); moved = true; alpha = Math.max(alpha, 0.3); return; }
  if (panning) { ox = ev.clientX - panning[0]; oy = ev.clientY - panning[1]; moved = true; return; }
  if (ev.target !== canvas) return;
  hover = at(cx, cy);
  if (hover) { tip.style.display = "block"; tip.style.left = `${cx + 14}px`; tip.style.top = `${cy + 10}px`;
    tip.textContent = `${hover.id}: ${hover.title || G.kinds[hover.kind] || hover.kind}`; }
  else tip.style.display = "none";
});
window.addEventListener("mouseup", ev => {
  if (!moved && ev.target === canvas) select(at(ev.offsetX, ev.offsetY));
  dragging = null; panning = null;
});
canvas.addEventListener("wheel", ev => {
  ev.preventDefault(); fitted = true; const f = Math.exp(-ev.deltaY * 0.0015), [x, y] = world(ev.offsetX, ev.offsetY);
  scale = Math.max(0.15, Math.min(6, scale * f)); ox = ev.offsetX - W / 2 - x * scale; oy = ev.offsetY - H / 2 - y * scale;
}, { passive: false });

function select(n) {
  selected = n || null;
  if (n && !ok(n)) { shownKinds.add(n.kind); if (n.past) showHistory = document.getElementById("history").checked = true; chips(); }
  refilter(); info(n);
  if (n) history.replaceState(null, "", `#${encodeURIComponent(n.id)}`);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const link = n => `<a data-id="${esc(n.id)}" class="${n.past ? "past" : ""}" title="${esc(n.title || "")}">${esc(n.id)}</a>${n.status ? ` <span class="past">${esc(n.status.slice(0, 30))}</span>` : ""}`;
function info(n) {
  const box = document.getElementById("info");
  if (!n) { box.innerHTML = '<p class="hint">Click a node, or find one by ID or words.</p>'; return; }
  const skip = new Set(["id", "kind", "title", "status", "out", "in", "past", "deg", "r", "x", "y", "vx", "vy"]);
  const rows = Object.keys(n).filter(k => !skip.has(k)).sort()
    .map(k => `<tr><td>${k === "src" ? "defined at" : esc(k)}</td><td>${esc(Array.isArray(n[k]) ? n[k].join(", ") : n[k])}</td></tr>`).join("");
  const groups = {};
  for (const e of n.out) (groups[`${e.rel} →`] ||= []).push([e.t, e.note]);
  for (const e of n.in) (groups[`← ${e.rel}`] ||= []).push([e.s, e.note]);
  const item = ([m, note]) => `<div>${link(m)}${note ? ` <span class="past">${esc(note)}</span>` : ""}</div>`;
  const links = Object.keys(groups).sort((a, b) => (a.includes(WEAK) - b.includes(WEAK)) || a.localeCompare(b)).map(g => {
    const live = groups[g].filter(([m]) => !m.past), gone = groups[g].filter(([m]) => m.past);
    return `<h3>${esc(g)} (${groups[g].length})</h3>` + live.map(item).join("")
      + (gone.length ? `<details><summary class="past">${gone.length} in history</summary>${gone.map(item).join("")}</details>` : "");
  }).join("");
  box.innerHTML = `<h2>${esc(n.id)}</h2><div class="what">${esc(G.kinds[n.kind] || n.kind)}${n.status ? ", " + esc(n.status) : ""}</div>`
    + (n.title ? `<div class="title">${esc(n.title)}</div>` : "") + (rows ? `<table>${rows}</table>` : "") + links;
}
document.getElementById("info").addEventListener("click", ev => { const id = ev.target.dataset && ev.target.dataset.id; if (id) select(byId.get(id)); });

function chips() {
  document.getElementById("kinds").innerHTML = kindsPresent.map(k =>
    `<span class="chip${shownKinds.has(k) ? "" : " off"}" data-kind="${esc(k)}" title="${esc(G.kinds[k] || k)}"><i style="background:${color(k)}"></i>${esc(k)} ${G.counts[k]}</span>`).join("");
}
document.getElementById("kinds").addEventListener("click", ev => {
  const k = ev.target.closest(".chip") && ev.target.closest(".chip").dataset.kind; if (!k) return;
  shownKinds.has(k) ? shownKinds.delete(k) : shownKinds.add(k); chips(); refilter();
});
document.getElementById("history").addEventListener("change", ev => { showHistory = ev.target.checked; refilter(); });
document.getElementById("hops").addEventListener("change", ev => { hops = +ev.target.value; refilter(); });

const search = document.getElementById("search"), hits = document.getElementById("hits");
let found = [];
search.addEventListener("input", () => {
  const terms = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  found = terms.length ? nodes.filter(n => terms.every(t => `${n.id} ${n.title || ""} ${n.owner || ""}`.toLowerCase().includes(t)))
    .sort((a, b) => (b.id.toLowerCase() === terms[0]) - (a.id.toLowerCase() === terms[0]) || a.past - b.past).slice(0, 40) : [];
  hits.innerHTML = found.map((n, i) => `<div data-i="${i}" class="${i ? "" : "on"}">${esc(n.id)} <span style="color:var(--muted)">${esc(n.title || "")}</span></div>`).join("");
  hits.style.display = found.length ? "block" : "none";
});
hits.addEventListener("click", ev => { const d = ev.target.closest("div[data-i]"); if (d) { select(found[+d.dataset.i]); hits.style.display = "none"; } });
search.addEventListener("keydown", ev => { if (ev.key === "Enter" && found.length) { select(found[0]); hits.style.display = "none"; search.blur(); } });
window.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== search) { ev.preventDefault(); search.focus(); }
  if (ev.key === "Escape") { hits.style.display = "none"; select(null); }
});

window.addEventListener("resize", resize);
resize(); chips(); refilter();
const start = byId.get(decodeURIComponent(location.hash.slice(1)));
if (start) select(start);
requestAnimationFrame(frame);
</script>
</body>
</html>
